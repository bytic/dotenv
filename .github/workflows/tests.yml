name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.2'
            symfony: '~5.0.0'
          - php: '7.2'
            symfony: '^5.4'
          - php: '8.0'
            symfony: '^5.4'
          - php: '8.1'
            symfony: '^6.4'
          - php: '8.2'
            symfony: '^7.4'
          - php: '8.4'
            symfony: '^8.0'
          - php: '8.5'
            symfony: '^8.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Select Symfony version
        run: composer require --no-update "symfony/console:${{ matrix.symfony }}" "symfony/dotenv:${{ matrix.symfony }}"
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Run tests
        run: vendor/bin/phpunit
